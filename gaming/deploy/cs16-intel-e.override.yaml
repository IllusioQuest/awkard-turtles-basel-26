# Compatibility experiment only; not evidence of free GPU capacity or measured heat.
# One physical Intel GPU is shared with other laptop containers. Encoding stays on CPU.
services:
  session-e:
    devices: ["/dev/dxg:/dev/dxg"]
    volumes:
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
      - /usr/lib/wsl/drivers:/usr/lib/wsl/drivers:ro
    environment:
      LIBGL_ALWAYS_SOFTWARE: "false"
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      GALLIUM_DRIVER: d3d12
      MESA_D3D12_DEFAULT_ADAPTER_NAME: Intel
