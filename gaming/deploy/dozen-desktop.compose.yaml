name: digitalheat-dozen
services:
  session-c:
    image: ${GAMING_DOZEN_IMAGE:?Run Start-DozenDesktop.ps1}
    ports: ["127.0.0.1:18883:8080"]
    devices: ["/dev/dxg:/dev/dxg"]
    volumes:
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
      - /usr/lib/wsl/drivers:/usr/lib/wsl/drivers:ro
      - session-c-home:/home/ubuntu
    shm_size: 1gb
    mem_limit: 4g
    cpus: 2
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    labels: { digitalheat.experiment: dozen }
    environment:
      GALLIUM_DRIVER: d3d12
      MESA_D3D12_DEFAULT_ADAPTER_NAME: Intel
      SELKIES_ENABLE_HTTPS: "false"
      SELKIES_BASIC_AUTH_USER: player
      SELKIES_BASIC_AUTH_PASSWORD: ${GAMING_DOZEN_PASSWORD:?Missing local password}
      SELKIES_USE_CPU: "true"
      SELKIES_ENCODER: h264enc
      SELKIES_FRAMERATE: "20-20"
      SELKIES_MANUAL_WIDTH: "1280"
      SELKIES_MANUAL_HEIGHT: "720"
      SELKIES_ENABLE_CLIPBOARD: "false"
      SELKIES_ENABLE_BINARY_CLIPBOARD: "false"
      SELKIES_FILE_TRANSFERS: none
      SELKIES_MICROPHONE_ENABLED: "false"
      SELKIES_WEBCAM_ENABLED: "false"
      SELKIES_PRINTING_ENABLED: "false"
volumes:
  session-c-home:
