x-node: &node
  image: digitalheat-render-node:lab
  pull_policy: never
  privileged: true
  cpus: 1.25
  mem_limit: 2304m
  pids_limit: 512
  tmpfs: ['/run']
  environment:
    MESH_TOKEN: ${MESH_TOKEN:?Run Start-Renderer.ps1}
    MESH_JOB_IMAGE: ${MESH_JOB_IMAGE:?Run Start-Renderer.ps1}
    TINI_SUBREAPER: '1'
  command: []
  networks: [mesh]
services:
  home:
    <<: *node
    ports: ['127.0.0.1:18900:8080']
    networks: [mesh, browser]
    volumes: ['home:/var/lib/mesh', './TestResults/home.json:/etc/mesh/node.json:ro']
  hotel:
    <<: *node
    volumes: ['hotel:/var/lib/mesh', './TestResults/hotel.json:/etc/mesh/node.json:ro']
  spa:
    <<: *node
    volumes: ['spa:/var/lib/mesh', './TestResults/spa.json:/etc/mesh/node.json:ro']
networks:
  mesh:
    internal: true
  browser: {}
volumes:
  home:
  hotel:
  spa:
