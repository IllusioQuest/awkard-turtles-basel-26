# These privileged containers emulate Linux servers, each with its own Docker Engine.
# Do not mount the outer Docker socket into them. Ports match the ingress demo destinations.
name: webhosting-engines
x-engine: &engine
  image: docker:29-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  privileged: true
  environment:
    DOCKER_TLS_CERTDIR: ""
  # Only the local Unix socket is needed; do not expose an unauthenticated Docker TCP API.
  # Keep the official entrypoint: it cleans stale PID files after crashes and initializes dind.
  command: ["dockerd", "--host=unix:///var/run/docker.sock"]
  restart: "no"
services:
  engine-a:
    <<: *engine
    ports: ["127.0.0.1:18081:18081"]
    volumes: ["engine-a-data:/var/lib/docker"]
  engine-b:
    <<: *engine
    ports: ["127.0.0.1:18082:18082"]
    volumes: ["engine-b-data:/var/lib/docker"]
  engine-c:
    <<: *engine
    ports: ["127.0.0.1:18083:18083"]
    volumes: ["engine-c-data:/var/lib/docker"]
volumes:
  engine-a-data:
  engine-b-data:
  engine-c-data:
