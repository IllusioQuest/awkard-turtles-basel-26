<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8ecfe2"><title>DigitalHeat · Live nodes</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#101719;background:#111}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{padding:10px}.grid{display:grid;width:100%;height:100%;grid-template:repeat(2,minmax(0,1fr))/repeat(2,minmax(0,1fr));gap:10px}.node{--room:#a2dceb;position:relative;overflow:hidden;border:5px solid #111;background:var(--room);transition:background-color .5s ease;isolation:isolate}.node[data-error]::after{content:"!";position:absolute;top:12px;left:16px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#9d1919;color:#fff;font-weight:900;font-size:22px}.number{position:absolute;top:18px;left:20px;font-weight:700;font-size:clamp(12px,1vw,18px);opacity:.48}.workers{position:absolute;inset:0;pointer-events:none}.spark{--dx:0px;--dy:0px;position:absolute;left:50%;top:50%;width:clamp(15px,2vw,29px);height:clamp(21px,2.8vw,40px);margin:-20px 0 0 -14px;opacity:0;transform:translate(var(--dx),var(--dy)) scale(.75);transition:opacity .35s;animation:scurry var(--pace,1.8s) ease-in-out infinite alternate;animation-play-state:paused;filter:drop-shadow(0 3px 2px #0004)}.spark::before{content:"";position:absolute;left:7px;top:0;width:11px;height:11px;border-radius:50%;background:#292320;border:2px solid #f5e4c1}.spark::after{content:"";position:absolute;left:4px;top:11px;width:17px;height:19px;border-radius:8px 8px 5px 5px;background:#f4f0db;border:2px solid #292320;box-shadow:-5px 17px 0 -6px #292320,5px 17px 0 -6px #292320}.spark:nth-child(1){--dx:-62px;--dy:-21px;animation-delay:-.1s}.spark:nth-child(2){--dx:48px;--dy:-37px;animation-delay:-.7s}.spark:nth-child(3){--dx:-32px;--dy:39px;animation-delay:-1.1s}.spark:nth-child(4){--dx:65px;--dy:31px;animation-delay:-1.5s}.spark:nth-child(5){--dx:4px;--dy:-2px;animation-delay:-.4s}.node[data-load="1"] .spark,.node[data-load="2"] .spark{opacity:1;animation-play-state:running}.node[data-load="1"] .spark:nth-child(n+4){opacity:.22}.node[data-load="0"] .spark{opacity:.08}.slider{position:absolute;z-index:2;right:17px;top:50%;height:min(76%,520px);width:clamp(42px,5vw,68px);transform:translateY(-50%);display:grid;place-items:center}.slider input{appearance:none;-webkit-appearance:none;writing-mode:vertical-lr;direction:rtl;width:100%;height:100%;background:linear-gradient(to top,#7fcbe5 0%,#dce7a3 50%,#ff9b56 100%);border:3px solid #111;border-radius:22px;cursor:ns-resize;touch-action:none;box-shadow:0 3px 10px #0002}.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:clamp(34px,4vw,54px);height:clamp(34px,4vw,54px);border-radius:50%;background:#fff;border:4px solid #171b1b;box-shadow:0 2px 7px #0005}.slider input::-moz-range-thumb{width:clamp(28px,3.4vw,46px);height:clamp(28px,3.4vw,46px);border-radius:50%;background:#fff;border:4px solid #171b1b;box-shadow:0 2px 7px #0005}.temperature{position:absolute;right:calc(clamp(42px,5vw,68px) + 29px);top:50%;transform:translateY(-50%);padding:7px 10px;border-radius:18px;background:#fff9;font-weight:700;font-size:clamp(12px,1.2vw,18px);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .2s;pointer-events:none}.node:focus-within .temperature{opacity:.9}.@keyframes scurry{from{transform:translate(calc(var(--dx) - 8px),calc(var(--dy) + 5px)) rotate(-8deg)}to{transform:translate(calc(var(--dx) + 9px),calc(var(--dy) - 5px)) rotate(8deg)}}@media(max-width:650px){body{padding:5px}.grid{gap:5px}.node{border-width:3px}.number{top:9px;left:10px}.slider{right:7px;width:35px}.slider input{border-width:2px}.temperature{right:48px}}
</style></head>
<body><main class="grid" id="grid" aria-label="Four independent live compute nodes"></main>
<script>
const grid=document.querySelector('#grid');let latest={},pending=new Map(),sending=new Set(),rendered=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function roomColor(temp){const stops=[[15,[104,195,224]],[20,[223,225,170]],[25,[255,133,53]]];let i=temp<20?0:1;const f=clamp((temp-stops[i][0])/(stops[i+1][0]-stops[i][0]),0,1);const rgb=stops[i][1].map((v,k)=>Math.round(v+(stops[i+1][1][k]-v)*f));return `rgb(${rgb.join(',')})`}
function render(data){latest=Object.fromEntries(data.nodes.map(n=>[n.id,n]));if(!rendered){grid.innerHTML=data.nodes.map(n=>`<section class="node" data-id="${n.id}" data-load="0"><span class="number">${String(n.position).padStart(2,'0')}</span><div class="workers" aria-hidden="true">${Array.from({length:5},()=>'<i class="spark"></i>').join('')}</div><span class="temperature"></span><label class="slider"><input aria-label="Node ${n.position} target temperature" type="range" min="15" max="25" step="0.5" value="${n.targetTemperatureC}" data-node="${n.id}"></label></section>`).join('');grid.querySelectorAll('input').forEach(input=>{input.addEventListener('input',()=>preview(input));input.addEventListener('change',()=>queueTarget(input));});rendered=true;}for(const n of data.nodes){const card=grid.querySelector(`[data-id="${n.id}"]`);card.dataset.load=n.actualLoad<.02?'0':n.actualLoad<.55?'1':'2';card.toggleAttribute('data-error',!!n.error);if(document.activeElement!==card.querySelector('input'))card.querySelector('input').value=n.targetTemperatureC;setColor(card,n.targetTemperatureC);}}
function setColor(card,temp){card.style.setProperty('--room',roomColor(temp));card.querySelector('.temperature').textContent=`${Number(temp).toFixed(1)}°`}
function preview(input){const card=input.closest('.node');setColor(card,+input.value);card.dataset.load=+input.value<=15?'0':+input.value<20?'1':'2';queueTarget(input)}
function queueTarget(input){pending.set(input.dataset.node,+input.value);flush(input.dataset.node)}
async function flush(id){if(sending.has(id))return;sending.add(id);while(pending.has(id)){const temp=pending.get(id);pending.delete(id);try{const response=await fetch(`/api/nodes/${encodeURIComponent(id)}/target`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({temperatureC:temp})});if(!response.ok){grid.querySelector(`[data-id="${id}"]`).dataset.error='true';console.error(await response.text())}else{const result=await response.json();if(latest[id])latest[id]={...latest[id],...result};}}catch(error){grid.querySelector(`[data-id="${id}"]`).dataset.error='true';console.error(error)}}sending.delete(id)}
async function refresh(){try{const response=await fetch('/api/state',{cache:'no-store'});if(response.ok)render(await response.json())}catch{}finally{setTimeout(refresh,800)}}refresh();
</script></body></html>
