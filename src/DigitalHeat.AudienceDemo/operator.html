<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigitalHeat · Four live workers</title>
<style>
body{margin:0;background:#101418;color:#f4f2ec;font:18px system-ui}header{padding:17px 3vw;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:26px;margin:0}small{color:#acb7b7}.queue{padding:7px 3vw;color:#e8dabb;background:#20252a;min-height:24px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);height:calc(100vh - 125px);gap:10px;padding:10px;box-sizing:border-box}.node{border:1px solid var(--c);border-radius:14px;padding:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,#101418),#151b20);position:relative;overflow:hidden}.node h2{margin:0;font-size:27px}.heat{display:flex;align-items:baseline;gap:12px;margin-top:18px}.metric{font-size:49px;font-weight:650}.label{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#c0c9c7}.bar{height:10px;border-radius:8px;background:#344047;margin:13px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);transition:width .5s}.jobs{margin-top:22px}.job{background:#121a1edb;border-left:4px solid var(--c);padding:9px 13px;margin:8px 0;border-radius:4px;font-size:16px}.job b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase}.tag{font-size:14px;color:#b9c6c4}
</style><header><h1>DigitalHeat · Live audience jobs</h1><small>Four logical workers · one laptop · reference-server heat, not laptop measurement</small></header><div class="queue" id="queue">Waiting for audience questions</div><main class="grid" id="grid"></main>
<script>
const grid=document.querySelector('#grid'),queue=document.querySelector('#queue');const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function update(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);const data=await r.json();const queued=data.jobs.filter(j=>j.state==='queued');queue.textContent=data.error?('Operator attention: '+data.error):queued.length?`${queued.length} incoming · ${queued.map(j=>j.question).slice(0,3).join('  ·  ')}`:'No jobs waiting';grid.innerHTML=data.workers.map(w=>{const jobs=data.jobs.filter(j=>j.node===w.id).slice(0,3);const running=Number(w.useful_heat_kwh_per_hour);return `<section class="node" style="--c:${w.color}"><h2>${escape(w.name)} <span class="tag">Worker ${w.id}</span></h2><div class="heat"><strong class="metric">${running.toFixed(1)}</strong><span>kWh/h of modelled useful heat</span></div><div class="bar"><i style="width:${Math.min(100,100*running/Math.max(.8,w.demand_kwh_per_hour))}%"></i></div><div class="label">Illustrative demand ${Number(w.demand_kwh_per_hour).toFixed(1)} kWh/h</div><div class="jobs">${jobs.length?jobs.map(j=>`<div class="job"><b>${escape(j.state)} · ${escape(j.id.slice(0,8))}</b>${escape(j.question)}</div>`).join(''):'<span class="tag">Ready for an eligible job</span>'}</div></section>`}).join('');}catch(e){document.querySelector('header small').textContent='Connection lost — '+e.message}}update();setInterval(update,2000);
</script></html>
